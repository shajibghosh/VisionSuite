# Instance segmentation on PCB (rect masks synthesised from boxes).
model: maskrcnn_v2             # see: python scripts/train_segmentation.py --list
ann_file: data/pcb/detection/annotations_tiled.json
epochs: 25
batch_size: 2
lr: 2.0e-4
val_frac: 0.2
patience: 8
seed: 42

